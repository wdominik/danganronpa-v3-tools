name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# rust-toolchain.toml pins the channel and components (rustfmt, clippy).
# actions/checkout writes the file; the next cargo invocation triggers
# rustup to install the pinned toolchain.

jobs:
  lint:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Doc
        run: cargo doc --workspace --no-deps

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Overrides the stable pin in rust-toolchain.toml. Keep in sync with
      # `rust-version` in Cargo.toml.
      RUSTUP_TOOLCHAIN: "1.97"
    steps:
      - uses: actions/checkout@v5

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.97 --profile minimal

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets
